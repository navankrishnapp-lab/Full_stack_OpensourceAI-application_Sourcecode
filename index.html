<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility & Privacy Oriented AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navic-header">
        <div class="logo-area">
            <div class="futuristic-core-container" aria-hidden="true" style="speak: none;">
                <div class="core-ring ring-outer-clockwise"></div>
                <div class="core-ring ring-middle-counter"></div>
                <div class="core-ring ring-inner-clockwise"></div>
                <div class="core-center-pulsing-dot"></div>
            </div>
            <div>
                <h1 tabindex="1">Accessibility & Privacy Oriented AI</h1>
            </div>
        </div>
        
        <button id="newChatBtn" class="action-btn" tabindex="4" aria-label="Open New Chat. Shortcut: Alt plus O" title="Open New Chat (Alt+O)">
            <svg class="futuristic-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14"/>
            </svg>
        </button>
    </header>

    <main id="chatWindow" class="chat-window" aria-label="Chat Message History" tabindex="-1">
    </main>

    <footer class="input-panel-wrapper">
        
        <div id="filePreviewContainer" class="file-preview-container" style="display: none;">
            <div class="file-capsule">
                <div class="file-icon-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" class="capsule-svg">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                </div>
                <div class="file-metadata">
                    <span id="previewFileName" class="preview-file-name">document.pdf</span>
                    <span class="preview-file-type">PDF</span>
                </div>
                <button id="removeFileBtn" class="remove-file-btn" aria-label="Remove attached document file" title="Remove File">
                    <svg viewBox="0 0 24 24" class="remove-svg" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="chat-input-container">
            <input type="file" id="fileAttachment" style="display: none;" accept=".pdf,.docx,.txt" aria-hidden="true">
            
            <button id="attachBtn" class="action-btn" tabindex="2" aria-label="Attach File Document. Shortcut: Alt plus F" title="Attach Document (Alt+F)">
                <svg class="futuristic-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
            </button>
            
            <textarea id="userInput" placeholder="Ask Me..." rows="1" tabindex="3" aria-label="Type your message here"></textarea>
            
            <button id="sendBtn" class="action-btn" tabindex="5" aria-label="Send Message. Shortcut: Enter" title="Send Message (Enter)">
                <svg class="futuristic-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>

        <p class="ai-system-disclaimer">
            Ai isn't human. It can make mistakes, so double check it.
        </p>
        
    </footer>

    <script src="script.js"></script>
</body>
</html>
